- FOCUS
description: >-
  FinOps view of Credly spend. Credly (a Pearson company) is a B2B digital
  credentialing platform sold to issuing organizations under contract, priced
  primarily on the volume of credentials (badges) issued plus platform features.
  The Web Service API and sandbox are entitlements of that subscription rather
  than a separately metered API product, so the dominant cost driver is annual
  credential issuance volume negotiated with Credly sales. Badge recipients incur
  no cost. Because pricing is contractual and not published, cost management
  centers on forecasting and governing credential issuance volume against the
  committed contract.
notes: >-
  Per-unit and tiered pricing are not public; obtain the credential-volume bands
  and contract terms from Credly (Pearson) to reconcile spend. Treat issued
  badge volume as the primary billable meter.
sources:
