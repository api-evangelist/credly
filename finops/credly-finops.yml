alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Credly
serviceCategory: Identity and Credentialing
billingModel:
  pricingCategory: Committed-Use
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
meters:
- name: credentials_issued
  description: Verifiable badges issued to recipients; the primary contractual billing driver.
  unit: badges
  aggregation: sum
  dimensions:
  - organization
  - badge_template
- name: badge_templates
  description: Badge templates maintained by the organization; may factor into platform tier.
  unit: templates
  aggregation: max
  dimensions:
  - organization
- name: platform_subscription
  description: Annual platform subscription fee for the issuing organization.
  unit: contract
  aggregation: max
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track issued badge volume per organization and badge template against the contracted annual credential allowance.
- name: Allocation
  description: Use issuer_earner_id and badge template names to attribute credential issuance to internal programs, teams, or cost centers.
- name: Optimization
  description: Retire unused badge templates, suppress unnecessary notification emails, and avoid duplicate issuance to keep credential volume aligned with the contract.
- name: Accountability
  description: Assign a program owner to reconcile monthly credential issuance against the committed contract and renewal negotiations with Credly.
maintainers:
