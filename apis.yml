aid: credly
url: https://raw.githubusercontent.com/api-evangelist/credly/refs/heads/main/apis.yml
name: Credly
kind: company
description: Credly is a digital credential and open badge platform, owned by Pearson
  (acquired 2022), used by more than 2,000 organizations to issue, manage, and verify
  verifiable digital badges and certifications. The Credly Web Service API (base
  https://api.credly.com/v1, with a sandbox at https://sandbox-api.credly.com/v1)
  lets issuing organizations create and manage badge templates, issue and revoke
  badges to recipients, read organization and employee data, pull an events feed,
  and expose recipient credentials via Open Badges Infrastructure (OBI) endpoints.
  Authentication is HTTP Basic (the organization's authorization_token as the
  username with a blank password) or OAuth 2.0 client_credentials. Real-time
  notifications are delivered via outbound webhooks (HTTPS POST callbacks), not a
  WebSocket.
